version: '3.9'

services:
  # ============================================================
  # Backend Service - Traffic API Server
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartflow-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: "http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000"
    networks:
      - smartflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - backend_logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # Frontend Service - Web UI Server
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartflow-frontend
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - smartflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================================
# Networks
# ============================================================
networks:
  smartflow-network:
    driver: bridge
    name: smartflow-network

# ============================================================
# Volumes
# ============================================================
volumes:
  backend_logs:
    driver: local
    name: smartflow-backend-logs
